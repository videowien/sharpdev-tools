<div class="page">
<h1>JWT Decoder</h1>
<p class="subtitle">Decode JSON Web Tokens. See the header, payload, and signature. Human-readable timestamps for exp/iat/nbf.</p>
<label for="token-input">Token</label>
<div class="token-wrap">
<textarea id="token-input" oninput="decode()" placeholder="Paste a JWT here (eyJ...)" spellcheck="false"></textarea>
<pre aria-hidden="true" class="token-colored" id="token-colored"></pre>
</div>
<div class="actions">
<button class="btn" onclick="loadSample()">Load sample</button>
<button class="btn btn-reset" onclick="clearAll()">Clear</button>
</div>
<div class="error-box" id="error-box" style="display:none"></div>
<div class="info-note">This tool only decodes. Signature verification requires the secret key.</div>
<div class="panels">
<div class="panel">
<div class="panel-head">
<span class="panel-title"><span class="dot dot-red"></span>Header</span>
<button class="small-btn" onclick="copyPanel('header-out')">Copy</button>
</div>
<pre class="panel-body" id="header-out">—</pre>
</div>
<div class="panel">
<div class="panel-head">
<span class="panel-title"><span class="dot dot-accent"></span>Payload</span>
<button class="small-btn" onclick="copyPanel('payload-out')">Copy</button>
</div>
<pre class="panel-body" id="payload-out">—</pre>
</div>
<div class="panel">
<div class="panel-head">
<span class="panel-title"><span class="dot dot-gray"></span>Signature</span>
<button class="small-btn" onclick="copyPanel('signature-out')">Copy</button>
</div>
<pre class="panel-body" id="signature-out">—</pre>
</div>
</div>
<div class="claims-card" id="claims-card" style="display:none">
<h3>Known claims</h3>
<div class="claims-list" id="claims-list"></div>
</div>
</div>
