<noscript><p style="color:#aaa;text-align:center;padding:40px;">This site requires JavaScript to function.</p></noscript>

<script>renderNav('cidr');</script>
<div class="page">
<h1>CIDR / Subnet Calculator</h1>
<p class="subtitle">Calculate IPv4 subnet ranges, masks, host counts, and binary representations from any CIDR notation.</p>
<div class="card">
<div class="inp-row">
<div class="inp-group big">
<label for="cidr">CIDR Notation</label>
<input autocomplete="off" id="cidr" spellcheck="false" type="text" value="10.0.0.0/16"/>
<div class="err" id="err"></div>
</div>
</div>
<div class="inp-row two">
<div class="inp-group">
<label for="ip">IP Address</label>
<input autocomplete="off" id="ip" spellcheck="false" type="text" value="10.0.0.0"/>
</div>
<div class="inp-group">
<label for="prefix">Prefix <span class="prefix-val" id="prefix-val">/16</span></label>
<input id="prefix" max="32" min="0" step="1" type="range" value="16"/>
</div>
</div>
</div>
<div class="results-grid" id="results"></div>
<div class="card bin-card">
<h2 class="sec-title">Binary Representation</h2>
<div class="bin-row" id="bin-row"></div>
<div class="bin-legend">
<span><span class="dot-net"></span>Network bits</span>
<span><span class="dot-host"></span>Host bits</span>
</div>
</div>
<div class="card split-card">
<h2 class="sec-title">Subnet Split</h2>
<div class="split-row">
<label for="split-prefix">Split into /<span id="split-prefix-val">24</span> subnets</label>
<input id="split-prefix" max="32" min="0" step="1" type="range" value="24"/>
<div class="split-meta" id="split-meta"></div>
</div>
<div class="split-list" id="split-list"></div>
</div>
<div class="info-card">
<p>IPv6 support coming soon. Click any field above to copy.</p>
</div>
</div>
<script src="/tools/cidr/cidr.js"></script>
