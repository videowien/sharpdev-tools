<h1>Markdown Table Builder</h1>
<p class="subtitle">Visual editor for GitHub-flavored Markdown tables. Paste from CSV, set alignment, sort columns.</p>
<div class="actions">
<button class="btn" id="add-row">+ Row</button>
<button class="btn" id="add-col">+ Column</button>
<button class="btn" id="rm-row">− Row</button>
<button class="btn" id="rm-col">− Column</button>
<button class="btn" id="import-btn">Import CSV/TSV/JSON</button>
<button class="btn" id="clear-btn">Clear</button>
</div>
<div class="grid-wrap">
<table class="editor" id="editor"></table>
</div>
<div class="actions">
<button class="btn" id="copy-md">Copy Markdown</button>
<button class="btn" id="dl-md">Download .md</button>
<button class="btn" id="dl-csv">Download .csv</button>
</div>
<label for="md-out" style="margin-top:20px">Markdown</label>
<textarea id="md-out" readonly="" spellcheck="false"></textarea>
<div class="import-modal" id="import-modal" style="display:none">
<div class="import-inner">
<h3>Import data</h3>
<p class="hint">Paste CSV, TSV, or a JSON array of objects. First row = headers (for CSV/TSV).</p>
<textarea id="import-txt" placeholder="name,age,city
Alex,32,Berlin
Jess,30,Oslo" spellcheck="false"></textarea>
<div class="import-actions">
<button class="btn" id="import-do">Import</button>
<button class="btn" id="import-cancel">Cancel</button>
</div>
