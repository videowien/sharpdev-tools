<body>
<noscript><p style="color:#aaa;text-align:center;padding:40px;">This site requires JavaScript to function.</p></noscript>
<script src="/shared/components.js?v=20260616a"></script>
<script>renderNav('picker');</script>
<div class="page">
<h1>Random Picker</h1>
<p class="subtitle">Pick names, numbers, or make decisions. Cryptographically random, not pseudo-random.</p>
<div class="tabs">
<button class="tab active" data-tab="names" onclick="switchTab('names')">From a list</button>
<button class="tab" data-tab="number" onclick="switchTab('number')">Random number</button>
<button class="tab" data-tab="coin" onclick="switchTab('coin')">Coin / dice</button>
</div>
<!-- Names tab -->
<div class="tab-panel" id="panel-names">
<label for="names-in">Your list (one per line)</label>
<textarea id="names-in" placeholder="Alice
Bob
Charlie
Diana"></textarea>
<div class="settings">
<div class="setting">
<label for="pick-count">Pick</label>
<input id="pick-count" min="1" type="number" value="1"/>
</div>
<label class="toggle">
<input checked="" id="no-repeats" type="checkbox"/>
<span>No repeats</span>
</label>
</div>
<button class="btn-big" onclick="pickNames()">Pick!</button>
<div class="result" id="names-result"></div>
</div>
<!-- Number tab -->
<div class="tab-panel" id="panel-number" style="display:none">
<div class="num-grid">
<div class="setting">
<label for="num-min">Min</label>
<input id="num-min" type="number" value="1"/>
</div>
<div class="setting">
<label for="num-max">Max</label>
<input id="num-max" type="number" value="100"/>
</div>
<div class="setting">
<label for="num-count">Count</label>
<input id="num-count" min="1" type="number" value="1"/>
</div>
</div>
<label class="toggle" style="margin-top:14px">
<input id="num-no-repeats" type="checkbox"/>
<span>No repeats</span>
</label>
<button class="btn-big" onclick="pickNumber()">Generate</button>
<div class="result" id="number-result"></div>
</div>
<!-- Coin / dice tab -->
<div class="tab-panel" id="panel-coin" style="display:none">
<div class="coin-grid">
<button class="big-action" onclick="flipCoin()">
<div class="big-action-icon">🪙</div>
<div class="big-action-label">Flip a coin</div>
</button>
<button class="big-action" onclick="rollDice(6)">
<div class="big-action-icon">🎲</div>
<div class="big-action-label">Roll d6</div>
</button>
<button class="big-action" onclick="rollDice(20)">
<div class="big-action-icon">🎲</div>
<div class="big-action-label">Roll d20</div>
</button>
<button class="big-action" onclick="rollMultiple()">
<div class="big-action-icon">🎲🎲</div>
<div class="big-action-label">2d6 (sum)</div>
</button>
</div>
<div class="result" id="coin-result"></div>
</div>
<div class="history-card" id="history-card" style="display:none">
<div class="history-header">
<span>Recent picks</span>
<button class="clear-btn" onclick="clearHistory()">Clear</button>
</div>
<div id="history"></div>
</div>
</div>
<script src="/tools/picker/picker.js"></script>
<script>renderFooter();</script>
