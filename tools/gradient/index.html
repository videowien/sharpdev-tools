<div class="page">
<h1>Gradient Generator</h1>
<p class="subtitle">Linear or radial, up to 10 color stops, live preview.</p>
<div class="gr-preview" id="gr-preview"></div>
<div class="gr-controls">
<div class="gr-type-row">
<div class="tabs">
<button type="button" class="tab-btn active" data-type="linear">Linear</button>
<button type="button" class="tab-btn" data-type="radial">Radial</button>
</div>
<div class="gr-angle-row" id="linear-opts">
<label>Angle</label>
<input type="range" id="angle" min="0" max="360" value="135">
<span class="val" id="angle-val">135&deg;</span>
</div>
<div class="gr-shape-row" id="radial-opts" style="display:none;">
<label>Shape</label>
<select id="shape">
<option value="circle">Circle</option>
<option value="ellipse" selected>Ellipse</option>
</select>
<label>Position</label>
<select id="position">
<option value="center" selected>Center</option>
<option value="top left">Top left</option>
<option value="top right">Top right</option>
<option value="bottom left">Bottom left</option>
<option value="bottom right">Bottom right</option>
</select>
</div>
</div>
<div class="gr-stops" id="gr-stops"></div>
<button type="button" class="add-btn" id="add-stop">+ Add stop</button>
</div>
<div class="code-panel">
<div class="code-head"><span>Generated CSS</span><button type="button" class="copy-btn" id="copy-btn">Copy</button></div>
<pre id="code-out"></pre>
</div>
</div>
<script src="/tools/gradient/gradient.js"></script>
