<div class="page">
<h1>Meeting Cost Calculator</h1>
<p class="subtitle">Find out how much your meetings really cost — you might be surprised.</p>
<div class="calc-layout">
<div class="card input-card">
<div class="input-group">
<label for="attendees">Number of attendees</label>
<input id="attendees" max="500" min="1" oninput="calculate()" type="number" value="5"/>
</div>
<div class="input-group">
<label for="avg-salary">Average annual salary</label>
<div class="input-with-unit">
<select id="currency" onchange="updatePresets(); calculate()">
<option selected="" value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
<option value="CHF">CHF</option>
<option value="¥">¥ JPY</option>
</select>
<input id="avg-salary" min="0" oninput="calculate()" step="1000" type="number" value="60000"/>
<span class="unit-label">/ year</span>
</div>
<div class="salary-hint" id="salary-presets"></div>
</div>
<div class="input-group">
<label for="duration">Meeting duration</label>
<div class="duration-row">
<div>
<input id="hours" max="24" min="0" oninput="calculate()" type="number" value="1"/>
<span class="unit-small">hours</span>
</div>
<div>
<input id="minutes" max="59" min="0" oninput="calculate()" step="5" type="number" value="0"/>
<span class="unit-small">minutes</span>
</div>
</div>
<div class="salary-hint">
<button class="preset-btn" onclick="setDuration(0,15)">15 min</button>
<button class="preset-btn" onclick="setDuration(0,30)">30 min</button>
<button class="preset-btn" onclick="setDuration(1,0)">1 hr</button>
<button class="preset-btn" onclick="setDuration(1,30)">1.5 hr</button>
<button class="preset-btn" onclick="setDuration(2,0)">2 hr</button>
</div>
</div>
<div class="input-group">
<label for="frequency">How often?</label>
<select id="frequency" onchange="calculate()">
<option selected="" value="once">One-time</option>
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="biweekly">Every 2 weeks</option>
<option value="monthly">Monthly</option>
</select>
</div>
</div>
<div class="results-card">
<div class="cost-hero">
<div class="cost-label">This meeting costs</div>
<div class="cost-amount" id="cost-total">$0</div>
<div class="cost-per-min" id="cost-per-min"></div>
</div>
<div class="cost-breakdown">
<div class="breakdown-item">
<span class="breakdown-label">Per person</span>
<span class="breakdown-val" id="cost-per-person">$0</span>
</div>
<div class="breakdown-item">
<span class="breakdown-label">Hourly rate (avg)</span>
<span class="breakdown-val" id="hourly-rate">$0/hr</span>
</div>
</div>
<div class="recurring-section" id="recurring-section" style="display:none">
<div class="recurring-title">Recurring cost</div>
<div class="recurring-grid">
<div class="recurring-item">
<span class="recurring-val" id="cost-monthly">$0</span>
<span class="recurring-label">per month</span>
</div>
<div class="recurring-item">
<span class="recurring-val" id="cost-yearly">$0</span>
<span class="recurring-label">per year</span>
</div>
</div>
</div>
<div class="equivalents" id="equivalents"></div>
</div>
</div>
</div>
