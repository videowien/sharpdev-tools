<div class="page">
<h1>JSON Diff</h1>
<p class="subtitle">Compare two JSON documents structurally. See added, removed, and changed values per path.</p>
<div class="actions">
<button class="btn btn-primary-act" onclick="runDiff()">Compare</button>
<button class="btn" onclick="swap()">Swap</button>
<button class="btn" onclick="loadSample()">Sample</button>
<button class="btn btn-reset" onclick="clearAll()">Clear</button>
</div>
<div class="controls">
<label class="toggle">
<input checked="" id="opt-sort" type="checkbox"/>
<span>Sort keys before comparing</span>
</label>
<label class="toggle">
<input id="opt-unchanged" type="checkbox"/>
<span>Show unchanged</span>
</label>
</div>
<div class="grid">
<div class="col">
<label for="orig">Original</label>
<textarea id="orig" placeholder='{"name": "alice", "age": 30}' spellcheck="false"></textarea>
<div class="col-err" id="err-orig"></div>
</div>
<div class="col">
<label for="upd">Updated</label>
<textarea id="upd" placeholder='{"name": "alice", "age": 31, "city": "Berlin"}' spellcheck="false"></textarea>
<div class="col-err" id="err-upd"></div>
</div>
</div>
<div class="output-wrap" id="output-wrap" style="display:none">
<div class="stats-bar" id="stats-bar"></div>
<div class="diff-actions">
<button class="small-btn" onclick="copyDiff()">Copy as text</button>
</div>
<div class="diff-list" id="diff-list"></div>
</div>
</div>
