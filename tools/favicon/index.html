<body>

<script>renderNav('favicon');</script>
<div class="page">
<h1>Favicon Generator</h1>
<p class="subtitle">Make a favicon from emoji, text, or an image. Download PNGs at every size. Copy ready-to-use HTML.</p>
<div class="tabs">
<button class="tab active" data-tab="emoji">Emoji</button>
<button class="tab" data-tab="text">Text</button>
<button class="tab" data-tab="image">Image</button>
</div>
<div class="layout">
<div class="controls-col">
<!-- Emoji -->
<div class="panel active" id="panel-emoji">
<label>Emoji</label>
<input id="emoji-input" maxlength="8" placeholder="Paste or type an emoji" type="text" value=""/>
<div class="picker" id="emoji-picker"></div>
</div>
<!-- Text -->
<div class="panel" id="panel-text">
<label>Text (1-3 chars)</label>
<input id="text-input" maxlength="3" type="text" value="SD"/>
<label>Font family</label>
<select id="text-font">
<option value="system">System</option>
<option value="serif">Serif</option>
<option value="monospace">Monospace</option>
<option value="cursive">Cursive</option>
</select>
<label>Font size (%)</label>
<input id="text-size" max="90" min="30" type="range" value="60"/>
<label>Text color</label>
<input id="text-color" type="color" value="#ffffff"/>
<label>Background color</label>
<input id="text-bg" type="color" value="#ff4444"/>
<label>Shape</label>
<div class="seg">
<button class="seg-btn active" data-shape="square">Square</button>
<button class="seg-btn" data-shape="rounded">Rounded</button>
<button class="seg-btn" data-shape="circle">Circle</button>
</div>
</div>
<!-- Image -->
<div class="panel" id="panel-image">
<label>Upload image</label>
<input accept="image/*" id="image-input" type="file"/>
<label><input id="image-circle" type="checkbox"/> Circular mask</label>
</div>
</div>
<div class="preview-col">
<div class="preview-row">
<div class="prev-box"><canvas height="16" id="prev-16" width="16"></canvas><div class="prev-label">16</div></div>
<div class="prev-box"><canvas height="32" id="prev-32" width="32"></canvas><div class="prev-label">32</div></div>
<div class="prev-box prev-big"><canvas height="256" id="prev-256" width="256"></canvas><div class="prev-label">256</div></div>
</div>
<div class="download-card card">
<h3>Download</h3>
<div class="size-list" id="size-list"></div>
<button class="btn btn-primary" id="btn-zip">Download all as .zip</button>
</div>
<div class="snippet-card card">
<h3>HTML snippet</h3>
<textarea id="snippet" readonly="" spellcheck="false"></textarea>
<button class="btn" id="btn-copy-snippet">Copy snippet</button>
</div>
<div class="snippet-card card" id="svg-card">
<h3>favicon.svg</h3>
<textarea id="svg-out" readonly="" spellcheck="false"></textarea>
<button class="btn" id="btn-copy-svg">Copy SVG</button>
</div>
</div>
</div>
</div>
<script src="/shared/zip.js"></script>
