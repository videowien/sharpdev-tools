<noscript><p style="color:#aaa;text-align:center;padding:40px;">This site requires JavaScript to function.</p></noscript>
<script src="/shared/components.js?v=20260616a"></script>
<script>renderNav('regex');</script>
<div class="page">
<h1>Regex Tester</h1>
<p class="subtitle">Test JavaScript regular expressions with live match highlighting, groups, and replace.</p>
<div class="regex-bar">
<span class="slash">/</span>
<input id="pattern" oninput="run()" placeholder="pattern" spellcheck="false" type="text"/>
<span class="slash">/</span>
<input id="flags" maxlength="8" oninput="run()" placeholder="flags" spellcheck="false" type="text" value="g"/>
</div>
<div class="flag-row">
<label class="flag"><input checked="" data-flag="g" onchange="toggleFlag(this)" type="checkbox"/><span>g <em>global</em></span></label>
<label class="flag"><input data-flag="i" onchange="toggleFlag(this)" type="checkbox"/><span>i <em>ignore case</em></span></label>
<label class="flag"><input data-flag="m" onchange="toggleFlag(this)" type="checkbox"/><span>m <em>multiline</em></span></label>
<label class="flag"><input data-flag="s" onchange="toggleFlag(this)" type="checkbox"/><span>s <em>dotall</em></span></label>
<label class="flag"><input data-flag="u" onchange="toggleFlag(this)" type="checkbox"/><span>u <em>unicode</em></span></label>
<label class="flag"><input data-flag="y" onchange="toggleFlag(this)" type="checkbox"/><span>y <em>sticky</em></span></label>
</div>
<div class="presets">
<span class="preset-label">Presets:</span>
<button class="preset-btn" onclick="setPreset('email')">Email</button>
<button class="preset-btn" onclick="setPreset('url')">URL</button>
<button class="preset-btn" onclick="setPreset('ipv4')">IPv4</button>
<button class="preset-btn" onclick="setPreset('phone')">Phone (US)</button>
<button class="preset-btn" onclick="setPreset('date')">Date (YYYY-MM-DD)</button>
<button class="preset-btn" onclick="setPreset('hex')">Hex color</button>
</div>
<label for="test-input">Test string</label>
<textarea id="test-input" oninput="run()" placeholder="Type or paste text to test against the pattern..." spellcheck="false"></textarea>
<div class="status" id="status">Awaiting input</div>
<label for="highlight">Highlighted</label>
<pre class="highlight" id="highlight"></pre>
<details class="matches-panel" id="matches-panel">
<summary>Match details (<span id="match-count">0</span>)</summary>
<div class="matches-list" id="matches-list"></div>
</details>
<div class="replace-section">
<label for="replacement">Replacement (supports $1, $2, …)</label>
<input id="replacement" oninput="run()" placeholder="$1 $2" spellcheck="false" type="text"/>
<label for="replaced" style="margin-top:14px">Result</label>
<pre class="replaced" id="replaced"></pre>
</div>
</div>
<script src="/tools/regex/regex.js"></script>
