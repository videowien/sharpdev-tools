<div class="page">
<h1>Mock Data Generator</h1>
<p class="subtitle">Generate fake users, addresses, dates for prototyping. Export as JSON, NDJSON, CSV, SQL, or TypeScript.</p>
<div class="panels">
<div class="panel">
<div class="panel-head">
<label>Schema</label>
<div class="presets">
<span class="preset-label">Presets:</span>
<button class="small-btn" data-preset="user">User</button>
<button class="small-btn" data-preset="customer">Customer</button>
<button class="small-btn" data-preset="product">Product</button>
<button class="small-btn" data-preset="transaction">Transaction</button>
<button class="small-btn" data-preset="post">Blog Post</button>
</div>
</div>
<div class="fields" id="fields"></div>
<button class="btn btn-add" id="btn-add">+ Add field</button>
<div class="options">
<div class="opt">
<label>Format</label>
<select id="opt-format">
<option selected="" value="json">JSON</option>
<option value="ndjson">NDJSON</option>
<option value="csv">CSV</option>
<option value="sql">SQL INSERT</option>
<option value="ts">TypeScript</option>
</select>
</div>
<div class="opt">
<label>Count</label>
<input id="opt-count" max="1000" min="1" type="number" value="10"/>
</div>
<div class="opt">
<label>Table / Type name</label>
<input id="opt-table" type="text" value="users"/>
</div>
<div class="opt">
<label>Seed (optional)</label>
<input id="opt-seed" placeholder="random" type="text"/>
</div>
</div>
<div class="actions">
<button class="btn" id="btn-gen">Regenerate</button>
<button class="btn" id="btn-copy">Copy</button>
<button class="btn" id="btn-dl">Download</button>
</div>
</div>

<label for="output">Output</label>
<textarea id="output" readonly="" spellcheck="false"></textarea>
<div class="stats" id="stats">0 chars</div>
</div>
</div>
