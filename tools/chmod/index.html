<div class="page">
<h1>chmod / Unix Permission Calculator</h1>
<p class="subtitle">Convert between octal (755), symbolic (rwxr-xr-x), and chmod commands. Visual permission grid.</p>
<div class="card">
<div class="field-row">
<div class="field">
<label for="f-octal">Octal</label>
<input autocomplete="off" id="f-octal" spellcheck="false" type="text" value="0755"/>
</div>
<div class="field">
<label for="f-symbolic">Symbolic</label>
<input autocomplete="off" id="f-symbolic" spellcheck="false" type="text" value="rwxr-xr-x"/>
</div>
<div class="field">
<label for="f-cmd">chmod command</label>
<input autocomplete="off" id="f-cmd" spellcheck="false" type="text" value="chmod 755"/>
</div>
</div>
</div>
<div class="card">
<h2 class="sec-title">Permission grid</h2>
<div class="grid-wrap">
<table class="perm-table">
<thead>
<tr>
<th></th>
<th>Read</th>
<th>Write</th>
<th>Execute</th>
<th>Special</th>
</tr>
</thead>
<tbody>
<tr>
<th>User (owner)</th>
<td><label class="cell"><input data-p="ur" type="checkbox"/><span>r</span></label></td>
<td><label class="cell"><input data-p="uw" type="checkbox"/><span>w</span></label></td>
<td><label class="cell"><input data-p="ux" type="checkbox"/><span>x</span></label></td>
<td><label class="cell" title="Setuid: Run with owner's permissions"><input data-p="suid" type="checkbox"/><span>setuid</span></label></td>
</tr>
<tr>
<th>Group</th>
<td><label class="cell"><input data-p="gr" type="checkbox"/><span>r</span></label></td>
<td><label class="cell"><input data-p="gw" type="checkbox"/><span>w</span></label></td>
<td><label class="cell"><input data-p="gx" type="checkbox"/><span>x</span></label></td>
<td><label class="cell" title="Setgid: Run with group's permissions"><input data-p="sgid" type="checkbox"/><span>setgid</span></label></td>
</tr>
<tr>
<th>Others</th>
<td><label class="cell"><input data-p="or" type="checkbox"/><span>r</span></label></td>
<td><label class="cell"><input data-p="ow" type="checkbox"/><span>w</span></label></td>
<td><label class="cell"><input data-p="ox" type="checkbox"/><span>x</span></label></td>
<td><label class="cell" title="Sticky bit: Only owner can delete files in a dir"><input data-p="sticky" type="checkbox"/><span>sticky</span></label></td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="card">
<h2 class="sec-title">Common presets</h2>
<div class="presets">
<button class="preset" data-oct="644">644 <span>file default</span></button>
<button class="preset" data-oct="755">755 <span>executable / dir</span></button>
<button class="preset" data-oct="600">600 <span>private file</span></button>
<button class="preset" data-oct="700">700 <span>private dir</span></button>
<button class="preset" data-oct="777">777 <span>avoid</span></button>
<button class="preset" data-oct="444">444 <span>read-only</span></button>
</div>
</div>
<div class="card">
<h2 class="sec-title">What this means</h2>
<p class="desc" id="desc"></p>
</div>
<div class="card">
<h2 class="sec-title">Apply commands</h2>
<div class="cmds">
<div class="cmd-row">
<label>Single file or directory</label>
<div class="cmd-box"><code id="cmd-file"></code></div>
</div>
<div class="cmd-row">
<label>Recursively to all files in ./path</label>
<div class="cmd-box"><code id="cmd-files"></code></div>
</div>
<div class="cmd-row">
<label>Recursively to all directories in ./path</label>
<div class="cmd-box"><code id="cmd-dirs"></code></div>
</div>
</div>
</div>
</div>
