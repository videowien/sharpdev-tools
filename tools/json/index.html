<div class="page">
<h1>JSON Formatter</h1>
<p class="subtitle">Format, validate, and clean up JSON. Paste messy API output, get readable structure.</p>
<div class="actions">
<button class="btn" onclick="format(2)">Pretty (2-space)</button>
<button class="btn" onclick="format(4)">Pretty (4-space)</button>
<button class="btn" onclick="minify()">Minify</button>
<button class="btn" onclick="sortKeys()">Sort keys</button>
<button class="btn" onclick="jsonEscape()">Escape as string</button>
<button class="btn" onclick="jsonUnescape()">Unescape string</button>
<button class="btn btn-reset" onclick="clearAll()">Clear</button>
</div>
<div class="grid">
<div class="col">
<label for="input">Input</label>
<textarea id="input" oninput="autoFormat()" placeholder='{"name":"example","values":[1,2,3]}' spellcheck="false"></textarea>
<div class="stats" id="stats-in">0 chars</div>
</div>
<div class="col">
<label for="output">Output</label>
<textarea id="output" placeholder="Formatted JSON will appear here..." readonly="" spellcheck="false"></textarea>
<div class="stats-row">
<span class="stats" id="stats-out">0 chars</span>
<div class="small-actions">
<button class="small-btn" onclick="copyOutput()">Copy</button>
<button class="small-btn" onclick="useAsInput()">Use as input</button>
</div>
</div>
</div>
</div>
<div class="error-box" id="error-box" style="display:none"></div>
<div class="success-box" id="success-box" style="display:none"></div>
</div>
