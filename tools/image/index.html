<noscript><p style="color:#aaa;text-align:center;padding:40px;">This site requires JavaScript to function.</p></noscript>

<div class="page">
<h1>Image Compressor &amp; Resizer</h1>
<p class="subtitle">Compress and resize JPG, PNG, WebP. Everything runs locally in your browser. No upload.</p>
<div class="card drop-card" id="drop-zone">
<input accept="image/*" hidden="" id="file-input" multiple="" type="file"/>
<div class="drop-inner">
<svg class="drop-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>
<p>Drop images here or <span class="link">click to browse</span></p>
<p class="hint">JPG, PNG, WebP · batch supported</p>
</div>
</div>
<div class="options-grid card">
<div class="opt">
<label>Max width (px)</label>
<input id="opt-w" min="1" placeholder="auto" type="number"/>
</div>
<div class="opt">
<label>Max height (px)</label>
<input id="opt-h" min="1" placeholder="auto" type="number"/>
</div>
<div class="opt">
<label>Output format</label>
<select id="opt-format">
<option value="keep">Keep original</option>
<option value="image/jpeg">JPG</option>
<option value="image/png">PNG</option>
<option value="image/webp">WebP</option>
</select>
</div>
<div class="opt opt-toggle">
<label><input checked="" id="opt-aspect" type="checkbox"/> Keep aspect ratio</label>
</div>
<div class="opt opt-mode">
<label>Mode</label>
<div class="seg">
<button class="seg-btn active" data-mode="quality">Quality</button>
<button class="seg-btn" data-mode="target">Target size</button>
</div>
</div>
<div class="opt" id="quality-row">
<label>Quality <span id="q-val">80</span></label>
<input id="opt-quality" max="100" min="1" type="range" value="80"/>
</div>
<div class="opt" id="target-row" style="display:none">
<label>Target size (KB)</label>
<input id="opt-target" min="1" type="number" value="100"/>
</div>
</div>
<div class="actions">
<button class="btn btn-primary" disabled="" id="btn-process">Process images</button>
<button class="btn" disabled="" id="btn-zip">Download all as .zip</button>
<button class="btn btn-reset" id="btn-clear">Clear</button>
</div>
<div class="compare card" id="compare" style="display:none">
<h3>Compare</h3>
<div class="compare-grid">
<div>
<div class="compare-label">Original <span id="orig-size"></span></div>
<img alt="original" id="orig-img"/>
</div>
<div>
<div class="compare-label">Compressed <span id="new-size"></span></div>
<img alt="compressed" id="new-img"/>
</div>
</div>
</div>
<div class="list" id="list"></div>
</div>
<script src="/shared/zip.js"></script>
<script src="/tools/image/image.js"></script>
