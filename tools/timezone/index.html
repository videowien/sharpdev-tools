<div class="page">
<h1>Time Zone Converter</h1>
<p class="subtitle">Convert times between any zones. Live world clock for your favorite cities.</p>
<section class="sec">
<h2 class="sec-title">Convert</h2>
<div class="convert-form">
<div>
<label>Date</label>
<input id="c-date" type="date"/>
</div>
<div>
<label>Time</label>
<input id="c-time" type="time"/>
</div>
<div>
<label>From</label>
<div class="tz-picker" data-target="from">
<input autocomplete="off" class="tz-search" id="from-search" placeholder="Search time zone..." type="text"/>
<input id="from-zone" type="hidden" value="UTC"/>
<div class="tz-dropdown" id="from-dropdown"></div>
</div>
</div>
<div>
<label>To (up to 6)</label>
<div class="tz-picker" data-target="to">
<input autocomplete="off" class="tz-search" id="to-search" placeholder="Add zone..." type="text"/>
<div class="tz-dropdown" id="to-dropdown"></div>
</div>
<div class="chips" id="to-chips"></div>
</div>
</div>
<div class="convert-results" id="convert-results"></div>
</section>
<section class="sec">
<h2 class="sec-title">World Clock</h2>
<div class="wc-add">
<div class="tz-picker" data-target="wc">
<input autocomplete="off" class="tz-search" id="wc-search" placeholder="Add a city..." type="text"/>
<div class="tz-dropdown" id="wc-dropdown"></div>
</div>
</div>
<div class="wc-grid" id="wc-grid"></div>
</section>
