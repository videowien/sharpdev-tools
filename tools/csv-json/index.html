<script>renderNav('csv-json');</script>
<div class="page">
<h1>CSV ↔ JSON Converter</h1>
<p class="subtitle">Convert between CSV and JSON. Handles quoted fields, escaped quotes, custom delimiters. Auto-detects direction.</p>
<div class="actions">
<button class="btn" onclick="csvToJson()">CSV → JSON</button>
<button class="btn" onclick="jsonToCsv()">JSON → CSV</button>
<button class="btn" onclick="swap()">Swap</button>
<button class="btn btn-reset" onclick="clearAll()">Clear</button>
</div>
<div class="options">
<label class="opt">
<span>Delimiter</span>
<select id="opt-delim">
<option value=",">Comma ,</option>
<option value=";">Semicolon ;</option>
<option value="tab">Tab</option>
<option value="|">Pipe |</option>
<option value="custom">Custom...</option>
</select>
<input id="opt-delim-custom" maxlength="3" placeholder="," style="display:none;width:52px;" type="text"/>
</label>
<label class="toggle">
<input checked="" id="opt-header" type="checkbox"/>
<span>First row is header</span>
</label>
<label class="toggle">
<input checked="" id="opt-pretty" type="checkbox"/>
<span>Pretty print JSON</span>
</label>
<label class="toggle">
<input id="opt-quote-all" type="checkbox"/>
<span>Quote all CSV fields</span>
</label>
</div>
<div class="grid">
<div class="col">
<label for="input">Input</label>
<textarea id="input" oninput="onInputChanged()" placeholder="Paste CSV or JSON here..." spellcheck="false"></textarea>
<div class="stats" id="stats-in">0 chars</div>
</div>
<div class="col">
<label for="output">Output</label>
<textarea id="output" placeholder="Result will appear here..." readonly="" spellcheck="false"></textarea>
<div class="stats-row">
<span class="stats" id="stats-out"> </span>
<div class="small-actions">
<button class="small-btn" onclick="copyOutput()">Copy</button>
<button class="small-btn" onclick="downloadOut()">Download</button>
<button class="small-btn" onclick="useAsInput()">Use as input</button>
</div>
</div>
</div>
</div>
<div class="error-box" id="error-box" style="display:none"></div>
</div>
<script src="/tools/csv-json/csv-json.js"></script>
