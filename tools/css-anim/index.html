<div class="page">
<h1>CSS Animation Generator</h1>
<p class="subtitle">Build keyframe animations visually. Drag timeline, edit per-frame properties, copy CSS.</p>
<div class="main-grid">
<div class="preview-col">
<div class="preview-stage" id="stage">
<div class="anim-el" id="anim-el"></div>
</div>
<div class="preview-controls">
<button class="small-btn" id="play-btn">Pause</button>
<button class="small-btn" id="replay-btn">Replay</button>
<label class="inline-slider">Speed <span id="speed-val">1.00x</span>
<input id="speed" max="4" min="0.25" step="0.05" type="range" value="1"/>
</label>
</div>
<div class="presets-row">
<button class="preset-btn" data-preset="pulse">Pulse</button>
<button class="preset-btn" data-preset="bounce">Bounce</button>
<button class="preset-btn" data-preset="shake">Shake</button>
<button class="preset-btn" data-preset="fade-in">Fade in</button>
<button class="preset-btn" data-preset="slide-in">Slide in</button>
<button class="preset-btn" data-preset="spin">Spin</button>
<button class="preset-btn" data-preset="wobble">Wobble</button>
</div>
</div>
<div class="controls-col">
<div class="card">
<h2 class="sec-title">Animation settings</h2>
<div class="grid-2">
<div class="inp"><label>Name</label><input id="a-name" type="text" value="myAnim"/></div>
<div class="inp"><label>Duration (s)</label><input id="a-dur" min="0.1" step="0.1" type="number" value="2"/></div>
<div class="inp"><label>Timing</label>
<select id="a-timing">
<option>linear</option>
<option selected="">ease</option>
<option>ease-in</option>
<option>ease-out</option>
<option>ease-in-out</option>
<option value="cubic-bezier(0.68, -0.55, 0.27, 1.55)">cubic-bezier (back)</option>
<option value="cubic-bezier(0.25, 0.46, 0.45, 0.94)">cubic-bezier (smooth)</option>
</select>
</div>
<div class="inp"><label>Iterations</label>
<select id="a-iter">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option selected="" value="infinite">infinite</option>
</select>
</div>
<div class="inp"><label>Direction</label>
<select id="a-dir">
<option>normal</option>
<option>reverse</option>
<option selected="">alternate</option>
<option>alternate-reverse</option>
</select>
</div>
<div class="inp"><label>Fill mode</label>
<select id="a-fill">
<option>none</option>
<option selected="">forwards</option>
<option>backwards</option>
<option>both</option>
</select>
</div>
</div>
</div>
</div>
</div>
<div class="card">
<h2 class="sec-title">Timeline <span class="sec-hint">click to add · drag to move</span></h2>
<div class="timeline" id="timeline">
<div class="timeline-track" id="track"></div>
<div class="timeline-labels">
<span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
</div>
</div>
<div class="frame-props" id="frame-props"></div>
</div>
<div class="card">
<h2 class="sec-title">Generated CSS</h2>
<pre class="code-block" id="code-out"></pre>
<button class="small-btn copy-code" id="copy-btn">Copy</button>
</div>
</div>
<script src="/tools/css-anim/css-anim.js"></script>
<script>renderFooter();</script>
