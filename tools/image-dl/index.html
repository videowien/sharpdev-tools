<div class="page">
<h1>Image Downloader</h1>
<p class="subtitle">Paste an image URL to download it, or paste any webpage to find and download all its images.</p>
<div class="card">
<label for="url-input">URL</label>
<div class="input-row">
<input autocomplete="url" id="url-input" placeholder="https://example.com/photo.jpg  or  https://example.com/gallery" type="text"/>
<button class="btn btn-primary" id="fetch-btn" onclick="fetchUrl()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px" viewbox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
        Fetch
      </button>
</div>
<div class="status-msg" id="status-msg"></div>
</div>
<!-- Single image preview -->
<div class="preview-single card" id="preview-single">
<img alt="Preview" src=""/>
<div class="img-info"></div>
<button class="btn btn-primary" onclick="downloadSingleImage()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px" viewbox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
      Download Image
    </button>
</div>
<!-- Multi-image grid -->
<div class="image-grid-header" id="image-grid-header">
<h3>Images on this page</h3>
<span class="count" id="image-count"></span>
</div>
<div class="select-bar" id="select-bar">
<button class="btn btn-secondary" onclick="selectAll()">Select All</button>
<button class="btn btn-secondary" onclick="selectNone()">Select None</button>
<span class="selected-count" id="selected-count">None selected</span>
</div>
<div class="image-grid" id="image-grid"></div>
<div class="download-bar" id="download-bar">
<button class="btn btn-primary" onclick="downloadSelected()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px" viewbox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
      Download Selected
    </button>
</div>
</div>
