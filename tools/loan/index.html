<body>
<noscript><p style="color:#aaa;text-align:center;padding:40px;">This site requires JavaScript to function.</p></noscript>
<script src="/shared/components.js?v=20260616a"></script>
<script>renderNav('loan');</script>
<div class="page">
<h1>Mortgage &amp; Loan Calculator</h1>
<p class="subtitle">Monthly payment, total interest, and full amortization schedule. With optional extra-payment scenarios.</p>
<div class="main-grid">
<div class="card">
<div class="input-grid">
<div>
<label for="amount">Loan amount</label>
<div class="prefix-wrap">
<span class="prefix" id="cur-prefix">$</span>
<input id="amount" min="0" step="1000" type="number" value="300000"/>
</div>
</div>
<div>
<label for="down">Down payment</label>
<div class="prefix-wrap">
<span class="prefix" id="cur-prefix2">$</span>
<input id="down" min="0" step="1000" type="number" value="0"/>
</div>
</div>
<div>
<label for="rate">Interest rate (annual %)</label>
<input id="rate" min="0" step="0.01" type="number" value="5.5"/>
</div>
<div>
<label for="years">Term (years)</label>
<input id="years" max="50" min="1" step="1" type="number" value="30"/>
</div>
<div>
<label for="start">Start date</label>
<input id="start" type="date"/>
</div>
<div>
<label for="extra">Extra monthly payment</label>
<div class="prefix-wrap">
<span class="prefix" id="cur-prefix3">$</span>
<input id="extra" min="0" step="10" type="number" value="0"/>
</div>
</div>
<div>
<label for="currency">Currency</label>
<select id="currency">
<option selected="" value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
<option value="CHF">CHF</option>
<option value="¥">¥ JPY</option>
</select>
</div>
</div>
</div>
</div>
<div class="results-grid">
<div class="stat-card big">
<div class="stat-label">Monthly payment</div>
<div class="stat-val" id="r-monthly">-</div>
</div>
<div class="stat-card">
<div class="stat-label">Total paid</div>
<div class="stat-val" id="r-total">-</div>
</div>
<div class="stat-card">
<div class="stat-label">Total interest</div>
<div class="stat-val" id="r-interest">-</div>
</div>
<div class="stat-card">
<div class="stat-label">Payoff date</div>
<div class="stat-val" id="r-payoff">-</div>
</div>
</div>
<div class="chart-card">
<svg height="180" id="donut" viewbox="0 0 200 200" width="180"></svg>
<div class="legend">
<div class="legend-row"><span class="legend-dot" style="background:#ff4444"></span><span>Principal</span><span class="legend-val" id="l-principal">-</span></div>
<div class="legend-row"><span class="legend-dot" style="background:#fbbf24"></span><span>Interest</span><span class="legend-val" id="l-interest">-</span></div>
</div>
</div>
<div class="savings-box" id="savings-box" style="display:none"></div>
<div class="schedule-card">
<div class="schedule-head">
<h2>Amortization schedule</h2>
<div class="sched-actions">
<button class="small-btn" id="toggle-all">Show all</button>
<button class="small-btn" onclick="exportCsv()">Export CSV</button>
</div>
</div>
<div class="table-wrap">
<table id="schedule">
<thead>
<tr>
<th>#</th><th>Date</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th>
</tr>
</thead>
<tbody id="schedule-body"></tbody>
</table>
</div>
</div>
</div>
<script src="/tools/loan/loan.js"></script>
<script>renderFooter();</script>
