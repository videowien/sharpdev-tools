<div class="page">
<h1>Find &amp; Replace</h1>
<p class="subtitle">Bulk find and replace with regex, case, and whole-word options. Nothing leaves your browser.</p>
<label for="text-in">Text</label>
<textarea id="text-in" oninput="frGo()" placeholder="Paste or type your text..."></textarea>
<div class="fr-controls">
<div class="fr-row">
<input type="text" id="find" placeholder="Find..." oninput="frGo()" autocomplete="off" spellcheck="false">
<input type="text" id="replace" placeholder="Replace with..." oninput="frGo()" autocomplete="off" spellcheck="false">
</div>
<div class="fr-opts">
<label class="chip"><input type="checkbox" id="opt-regex" onchange="frGo()"> Regex</label>
<label class="chip"><input type="checkbox" id="opt-case" onchange="frGo()"> Case sensitive</label>
<label class="chip"><input type="checkbox" id="opt-word" onchange="frGo()"> Whole word</label>
<span class="match-count" id="match-count">0 matches</span>
</div>
</div>
<div class="err" id="err"></div>
<div class="out-head">
<label for="out">Result</label>
<button class="copy-btn" id="copy-btn" type="button">Copy</button>
</div>
<textarea id="out" readonly></textarea>
</div>
<script src="/tools/find-replace/find-replace.js"></script>
