<div class="page">
<h1>Website Screenshot</h1>
<p class="subtitle">Enter a URL to capture a full-page screenshot from top to bottom.</p>
<div class="card">
<label for="url-input">Website URL</label>
<div class="input-row">
<input autocomplete="url" id="url-input" placeholder="https://example.com" type="text"/>
<button class="btn btn-primary" id="capture-btn" onclick="captureScreenshot()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px" viewbox="0 0 24 24"><rect height="18" rx="2" width="18" x="3" y="3"></rect><circle cx="12" cy="12" r="3"></circle></svg>
        Capture
      </button>
</div>
<div class="options-row">
<div>
<label for="width-select">Device</label>
<select id="width-select">
<option selected="" value="1440">Desktop (1440px)</option>
<option value="768">Tablet (768px)</option>
<option value="375">Mobile (375px)</option>
</select>
</div>
<div>
<label for="format-select">Format</label>
<select id="format-select">
<option selected="" value="png">PNG (lossless)</option>
<option value="jpg">JPG (smaller file)</option>
</select>
</div>
</div>
<div class="status-msg" id="status-msg"></div>
</div>
<div class="preview-area" id="preview-area">
<div class="preview-header">
<h3>Preview</h3>
<span class="screenshot-info" id="screenshot-info"></span>
</div>
<div class="preview-container">
<img alt="Screenshot preview" id="preview-img" src=""/>
</div>
<div class="download-row">
<button class="btn btn-primary" id="download-btn" onclick="downloadScreenshot()">

      </button>
</div>
</div>
</div>
