<div class="page">
<h1>Timer, Stopwatch &amp; Pomodoro</h1>
<p class="subtitle">Three timers in one. Notifications fire even when the tab is in the background.</p>
<div class="tabs">
<button class="tab active" data-tab="pomodoro">Pomodoro</button>
<button class="tab" data-tab="stopwatch">Stopwatch</button>
<button class="tab" data-tab="countdown">Countdown</button>
</div>
<!-- Pomodoro -->
<div class="panel active" id="panel-pomodoro">
<div class="ring-wrap">
<svg class="ring" viewbox="0 0 200 200">
<circle class="ring-bg" cx="100" cy="100" r="92"></circle>
<circle class="ring-fg" cx="100" cy="100" id="pomo-ring" r="92"></circle>
</svg>
<div class="ring-center">
<div class="phase-label" id="pomo-phase">Work</div>
<div class="time" id="pomo-time">25:00</div>
<div class="session-label" id="pomo-session">Session 1 of 4</div>
</div>
</div>
<div class="ctrl-row">
<button class="btn btn-primary" id="pomo-start">Start</button>
<button class="btn" id="pomo-pause">Pause</button>
<button class="btn" id="pomo-reset">Reset</button>
<button class="btn" id="pomo-skip">Skip</button>
</div>
<div class="opts">
<label>Work <input id="pomo-work" max="120" min="1" type="number" value="25"/></label>
<label>Short break <input id="pomo-short" max="60" min="1" type="number" value="5"/></label>
<label>Long break <input id="pomo-long" max="60" min="1" type="number" value="15"/></label>
<label>Sessions <input id="pomo-count" max="10" min="1" type="number" value="4"/></label>
</div>
</div>
<!-- Stopwatch -->
<div class="panel" id="panel-stopwatch">
<div class="stop-time" id="sw-time">00:00.00</div>
<div class="ctrl-row">
<button class="btn btn-primary" id="sw-start">Start</button>
<button class="btn" id="sw-pause">Pause</button>
<button class="btn" id="sw-lap">Lap</button>
<button class="btn" id="sw-reset">Reset</button>
</div>
<div class="laps" id="sw-laps"></div>
</div>
<!-- Countdown -->
<div class="panel" id="panel-countdown">
<div class="ring-wrap">
<svg class="ring" viewbox="0 0 200 200">
<circle class="ring-bg" cx="100" cy="100" r="92"></circle>
<circle class="ring-fg" cx="100" cy="100" id="cd-ring" r="92"></circle>
</svg>
<div class="ring-center">
<div class="phase-label">Countdown</div>
<div class="time" id="cd-time">00:00:00</div>
</div>
</div>
<div class="ctrl-row">
<button class="btn btn-primary" id="cd-start">Start</button>
<button class="btn" id="cd-pause">Pause</button>
<button class="btn" id="cd-reset">Reset</button>
</div>
<div class="opts">
<label>Hours <input id="cd-h" max="99" min="0" type="number" value="0"/></label>
<label>Minutes <input id="cd-m" max="59" min="0" type="number" value="5"/></label>
<label>Seconds <input id="cd-s" max="59" min="0" type="number" value="0"/></label>
<label>or hh:mm:ss <input id="cd-text" placeholder="0:05:00" type="text"/></label>
</div>
</div>
</div>
<script src="/tools/timer/timer.js"></script>
<script>renderFooter();</script>
