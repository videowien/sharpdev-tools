<div class="page">
<h1>SQL Formatter</h1>
<p class="subtitle">Format messy SQL. Keywords on new lines, indented clauses. Handles comments and strings correctly.</p>
<div class="actions">
<button class="btn" onclick="doFormat()">Format</button>
<button class="btn" onclick="doMinify()">Minify</button>
<button class="btn" onclick="setCase('upper')">Keywords UPPER</button>
<button class="btn" onclick="setCase('lower')">Keywords lower</button>
<button class="btn" onclick="swap()">Use output as input</button>
<button class="btn" onclick="copyOut()">Copy</button>
<button class="btn btn-reset" onclick="clearAll()">Clear</button>
</div>
<div class="opt-row">
<label>Indent:
      <select id="opt-indent">
<option value="2">2 spaces</option>
<option selected="" value="4">4 spaces</option>
<option value="tab">tab</option>
</select>
</label>
<label>Keyword case:
      <select id="opt-case">
<option selected="" value="upper">UPPER</option>
<option value="lower">lower</option>
<option value="preserve">preserve</option>
</select>
</label>
<label>Commas:
      <select id="opt-comma">
<option selected="" value="end">end of line</option>
<option value="start">start of line</option>
</select>
</label>
</div>
<div class="grid">
<div class="col">
<label for="input">Input</label>
<textarea id="input" placeholder="select id, name, email from users where active=1 and signup_date &gt; '2024-01-01' order by signup_date desc limit 10;" spellcheck="false"></textarea>
<div class="stats" id="stats-in">0 chars</div>
</div>
<div class="col">
<label for="output">Output</label>
<textarea id="output" placeholder="Formatted SQL will appear here..." readonly="" spellcheck="false"></textarea>
<div class="stats" id="stats-out">0 chars</div>
</div>
</div>
</div>
<script src="/tools/sql/sql.js"></script>
