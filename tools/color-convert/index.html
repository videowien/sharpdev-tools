<div class="page">
<h1>Color Converter</h1>
<p class="subtitle">Convert colors between HEX, RGB, HSL, and HSV. Type any format or pick visually.</p>
<div class="main-grid">
<div class="swatch-col">
<div class="swatch" id="swatch"></div>
<div class="swatch-controls">
<input id="picker" type="color" value="#ff4444"/>
<label class="picker-label" for="picker">Native picker</label>
</div>
<div class="nearest-box">
<div class="nearest-label">Nearest named</div>
<div class="nearest-name" id="nearest-name">red</div>
</div>
</div>
<div class="fields-col">
<label for="parse-input">Parse any format</label>
<input autocomplete="off" id="parse-input" placeholder="#ff4444 · rgb(255,68,68) · hsl(0,100%,63%) · red" spellcheck="false" type="text"/>
<div class="row">
<label>HEX</label>
<div class="field">
<input id="out-hex" readonly="" type="text"/>
<button class="small-btn" onclick="copyField('out-hex')">Copy</button>
</div>
</div>
<div class="row">
<label>RGB</label>
<div class="field">
<input id="out-rgb" readonly="" type="text"/>
<button class="small-btn" onclick="copyField('out-rgb')">Copy</button>
</div>
</div>
<div class="row">
<label>RGBA <span class="alpha-val" id="alpha-val">1.00</span></label>
<div class="field">
<input id="out-rgba" readonly="" type="text"/>
<button class="small-btn" onclick="copyField('out-rgba')">Copy</button>
</div>
<input class="alpha-slider" id="alpha-slider" max="1" min="0" step="0.01" type="range" value="1"/>
</div>
<div class="row">
<label>HSL</label>
<div class="field">
<input id="out-hsl" readonly="" type="text"/>
<button class="small-btn" onclick="copyField('out-hsl')">Copy</button>
</div>
</div>
<div class="row">
<label>HSV</label>
<div class="field">
<input id="out-hsv" readonly="" type="text"/>
<button class="small-btn" onclick="copyField('out-hsv')">Copy</button>
</div>
</div>
<div class="row">
<label>CMYK</label>
<div class="field">
<input id="out-cmyk" readonly="" type="text"/>
<button class="small-btn" onclick="copyField('out-cmyk')">Copy</button>
</div>
</div>
</div>
</div>
