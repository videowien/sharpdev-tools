<div class="page">
<h1>Line Sorter &amp; Deduplicator</h1>
<p class="subtitle">Clean up any list — sort, dedupe, reverse, trim.</p>
<div class="actions">
<button class="btn" onclick="apply('sort-asc')">Sort A → Z</button>
<button class="btn" onclick="apply('sort-desc')">Sort Z → A</button>
<button class="btn" onclick="apply('sort-len-asc')">Shortest first</button>
<button class="btn" onclick="apply('sort-len-desc')">Longest first</button>
<button class="btn" onclick="apply('reverse')">Reverse</button>
<button class="btn" onclick="apply('shuffle')">Shuffle</button>
<button class="btn" onclick="apply('dedupe')">Remove duplicates</button>
<button class="btn" onclick="apply('trim')">Trim whitespace</button>
<button class="btn" onclick="apply('blank')">Remove blank lines</button>
<button class="btn" onclick="apply('number')">Number lines</button>
</div>
<div class="grid">
<div class="col">
<label for="input">Input</label>
<textarea id="input" placeholder="Paste your list here, one item per line..." spellcheck="false"></textarea>
<div class="stats" id="stats-in">0 lines</div>
</div>
<div class="col">
<label for="output">Output</label>
<textarea id="output" placeholder="Result will appear here..." spellcheck="false"></textarea>
<div class="stats-row">
<span class="stats" id="stats-out">0 lines</span>
<div class="small-actions">
<button class="small-btn" onclick="copyOutput()">Copy</button>
<button class="small-btn" onclick="swap()">Use as input</button>
</div>
</div>
</div>
</div>
