<script>renderNav('base64');</script>
<div class="page">
<h1>Base64 Encoder/Decoder</h1>
<p class="subtitle">Encode or decode Base64. Works with text and files. Auto-detects direction.</p>
<div class="actions">
<button class="btn" onclick="doEncode()">Encode →</button>
<button class="btn" onclick="doDecode()">← Decode</button>
<button class="btn" onclick="swap()">Swap</button>
<label class="toggle">
<input id="opt-urlsafe" onchange="onOptionsChanged()" type="checkbox"/>
<span>URL-safe</span>
</label>
<label class="toggle">
<input id="opt-file" onchange="onFileModeToggle()" type="checkbox"/>
<span>File mode</span>
</label>
<button class="btn btn-reset" onclick="clearAll()">Clear</button>
</div>
<div class="file-zone" id="file-zone" style="display:none">
<input hidden="" id="file-input" type="file"/>
<p><strong>File mode</strong> — drop a file here or <button class="link-btn" onclick="document.getElementById('file-input').click()">pick one</button>.</p>
<p class="hint" id="file-info">No file selected.</p>
<div class="file-actions">
<button class="btn" onclick="encodeFile()">Encode file → base64</button>
<button class="btn" onclick="decodeToFile()">Decode base64 → download file</button>
</div>
</div>
<div class="hint-box" id="hint-box" style="display:none"></div>
<div class="grid">
<div class="col">
<label for="input">Input</label>
<textarea id="input" oninput="onInputChanged()" placeholder="Paste text or base64 here..." spellcheck="false"></textarea>
<div class="stats" id="stats-in">0 chars</div>
</div>
<div class="col">
<label for="output">Output</label>
<textarea id="output" placeholder="Result will appear here..." readonly="" spellcheck="false"></textarea>
<div class="stats-row">
<span class="stats" id="stats-out">0 chars</span>
<div class="small-actions">
<button class="small-btn" onclick="copyOutput()">Copy</button>
<button class="small-btn" onclick="useAsInput()">Use as input</button>
</div>
</div>
</div>
</div>
<div class="error-box" id="error-box" style="display:none"></div>
</div>
<script src="/tools/base64/base64.js"></script>
<script>renderFooter();</script>
