<div class="page">
<h1>QR Code Generator</h1>
<p class="subtitle">Generate QR codes that work forever. No redirects, no expiration, no tracking.</p>
<div class="qr-layout">
<div class="card qr-input-card">
<label for="qr-text">Content</label>
<div class="type-tabs">
<button class="type-tab active" data-type="url" onclick="setType('url')">URL</button>
<button class="type-tab" data-type="text" onclick="setType('text')">Text</button>
<button class="type-tab" data-type="email" onclick="setType('email')">Email</button>
<button class="type-tab" data-type="wifi" onclick="setType('wifi')">WiFi</button>
<button class="type-tab" data-type="phone" onclick="setType('phone')">Phone</button>
</div>
<div class="type-input" id="input-url">
<input id="input-url-val" oninput="generate()" placeholder="https://example.com" type="text"/>
</div>
<div class="type-input" id="input-text" style="display:none">
<textarea id="input-text-val" oninput="generate()" placeholder="Any text you want to encode..."></textarea>
</div>
<div class="type-input" id="input-email" style="display:none">
<input id="input-email-val" oninput="generate()" placeholder="hello@example.com" type="email"/>
</div>
<div class="type-input" id="input-wifi" style="display:none">
<input id="input-wifi-ssid" oninput="generate()" placeholder="Network name (SSID)" type="text"/>
<input id="input-wifi-pass" oninput="generate()" placeholder="Password" type="text"/>
<select id="input-wifi-enc" onchange="generate()">
<option value="WPA">WPA/WPA2</option>
<option value="WEP">WEP</option>
<option value="nopass">No password</option>
</select>
</div>
<div class="type-input" id="input-phone" style="display:none">
<input id="input-phone-val" oninput="generate()" placeholder="+43 676 1234567" type="tel"/>
</div>
<div class="options-section">
<div class="option-row">
<div>
<label for="qr-size">Size</label>
<select id="qr-size" onchange="generate()">
<option value="6">Small (210px)</option>
<option selected="" value="8">Medium (280px)</option>
<option value="12">Large (420px)</option>
<option value="16">XL (560px)</option>
</select>
</div>
<div>
<label for="qr-errlevel">Error correction</label>
<select id="qr-errlevel" onchange="generate()">
<option value="L">Low (7%)</option>
<option selected="" value="M">Medium (15%)</option>
<option value="Q">Quartile (25%)</option>
<option value="H">High (30%)</option>
</select>
</div>
</div>
<div class="option-row">
<div>
<label for="qr-fg">Foreground</label>
<div class="color-input">
<input id="qr-fg" onchange="generate()" type="color" value="#000000"/>
<span id="qr-fg-hex">#000000</span>
</div>
</div>
<div>
<label for="qr-bg">Background</label>
<div class="color-input">
<input id="qr-bg" onchange="generate()" type="color" value="#ffffff"/>
<span id="qr-bg-hex">#ffffff</span>
</div>
</div>
</div>
</div>
</div>
<div class="qr-preview-card">
<div class="qr-placeholder" id="qr-placeholder">
<p>Enter content to generate a QR code</p>
</div>
<div class="qr-canvas-wrap" id="qr-canvas-wrap" style="display:none">
<canvas id="qr-canvas"></canvas>
</div>
<div class="qr-info" id="qr-info"></div>
<div class="download-row" id="download-row" style="display:none">
<button class="btn btn-primary" onclick="downloadPng()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px" viewbox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
          PNG
        </button>
<button class="btn btn-secondary" onclick="downloadSvg()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px" viewbox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
          SVG
        </button>
</div>
</div>
</div>
</div>
