<div class="page">
<h1>PDF to Text</h1>
<p class="subtitle">Upload a PDF to extract all text. Everything runs in your browser — your file never leaves your device.</p>
<div class="card">
<div class="upload-area" id="upload-area">
<input accept=".pdf" hidden="" id="file-input" type="file"/>
<div class="upload-content" id="upload-content">
<svg class="upload-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>
<p>Drop a PDF here or <span class="upload-link">click to browse</span></p>
<p class="upload-hint">PDF files only. Processed entirely in your browser.</p>
</div>
</div>
<div class="progress-area" id="progress-area" style="display:none">
<div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
<div class="progress-text" id="progress-text">Loading PDF...</div>
</div>
</div>
<div class="card result-area" id="result-area" style="display:none">
<div class="result-header">
<div>
<h3 id="file-name">document.pdf</h3>
<span class="page-count" id="page-count"></span>
</div>
<div class="result-actions">
<button class="btn btn-primary btn-sm" onclick="copyText()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px" viewbox="0 0 24 24"><rect height="13" rx="2" width="13" x="9" y="9"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
          Copy All
        </button>
<button class="btn btn-secondary btn-sm" onclick="downloadTxt()">Download .txt</button>
<button class="btn btn-secondary btn-sm" onclick="resetTool()">New PDF</button>
<span class="copy-msg" id="copy-msg"></span>
</div>
</div>
<div class="result-text" id="result-text"></div>
<div class="word-count" id="word-count"></div>
</div>
</div>
<script src="/tools/pdf-text/pdf-text.js" type="module"></script>
