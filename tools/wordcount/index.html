<div class="page">
<h1>Word Counter</h1>
<p class="subtitle">Paste or type text to get instant word, character, and sentence counts.</p>
<div class="stats-bar" id="stats-bar">
<div class="stat"><span class="stat-num" id="s-words">0</span><span class="stat-label">Words</span></div>
<div class="stat"><span class="stat-num" id="s-chars">0</span><span class="stat-label">Characters</span></div>
<div class="stat"><span class="stat-num" id="s-chars-ns">0</span><span class="stat-label">No spaces</span></div>
<div class="stat"><span class="stat-num" id="s-sentences">0</span><span class="stat-label">Sentences</span></div>
<div class="stat"><span class="stat-num" id="s-paragraphs">0</span><span class="stat-label">Paragraphs</span></div>
</div>
<div class="card">
<textarea id="text-input" placeholder="Start typing or paste your text here..."></textarea>
</div>
<div class="details-bar" id="details-bar">
<div class="detail"><span id="d-readtime">0 min</span> read</div>
<div class="detail"><span id="d-speaktime">0 min</span> speaking</div>
<div class="detail"><span id="d-lines">0</span> lines</div>
<div class="detail-actions">
<button class="btn btn-secondary btn-sm" onclick="copyText()">Copy</button>
<button class="btn btn-secondary btn-sm" onclick="clearText()">Clear</button>
</div>
</div>
</div>
