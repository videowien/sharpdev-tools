<h1>XML Formatter &amp; XML ↔ JSON</h1>
<p class="subtitle">Format, minify, and convert XML. Handles attributes, namespaces, CDATA, processing instructions.</p>
<div class="actions">
<button class="btn" id="btn-format">Format XML</button>
<button class="btn" id="btn-min">Minify XML</button>
<button class="btn" id="btn-x2j">XML → JSON</button>
<button class="btn" id="btn-j2x">JSON → XML</button>
<button class="btn" id="btn-swap">Swap</button>
<button class="btn" id="btn-copy">Copy</button>
<button class="btn btn-reset" id="btn-clear">Clear</button>
</div>
<div class="options">
<div class="opt">
<label>Indent</label>
<select id="opt-indent">
<option selected="" value="2">2 spaces</option>
<option value="4">4 spaces</option>
<option value="tab">Tabs</option>
</select>
</div>
<div class="opt">
<label>Root (JSON → XML)</label>
<input id="opt-root" type="text" value="root"/>
</div>
<div class="opt chks">
<label class="chk"><input checked="" id="opt-simplify" type="checkbox"/> Simplify single-text children (XML → JSON)</label>
</div>
</div>
<div class="grid">
<div class="col">
<label for="input">Input</label>
<textarea id="input" placeholder='&lt;catalog&gt;
  &lt;book id="1"&gt;
    &lt;title&gt;Example&lt;/title&gt;
  &lt;/book&gt;
&lt;/catalog&gt;' spellcheck="false"></textarea>
<div class="stats" id="stats-in">0 chars</div>

<div class="col">

</div>
