<div class="page">
<h1>Timestamp Converter</h1>
<p class="subtitle">Unix timestamps ↔ human-readable dates. Supports seconds and milliseconds.</p>
<div class="live-box">
<div class="live-label">Current time</div>
<div class="live-value" id="now-unix">—</div>
<div class="live-sub" id="now-human">—</div>
</div>
<div class="grid">
<div class="card">
<label for="unix-in">Unix timestamp → date</label>
<input id="unix-in" oninput="convertUnix()" placeholder="1700000000" type="text"/>
<div class="unit-toggle">
<label class="toggle"><input checked="" name="unit" onchange="convertUnix()" type="radio" value="s"/> Seconds</label>
<label class="toggle"><input name="unit" onchange="convertUnix()" type="radio" value="ms"/> Milliseconds</label>
<label class="toggle"><input name="unit" onchange="convertUnix()" type="radio" value="auto"/> Auto-detect</label>
</div>
<div class="result-block" id="unix-result"></div>
</div>
<div class="card">
<label for="date-in">Date → Unix timestamp</label>
<input id="date-in" oninput="convertDate()" step="1" type="datetime-local"/>
<button class="mini-btn" onclick="setNow()">Set to now</button>
<div class="result-block" id="date-result"></div>
</div>
</div>
<div class="card">
<label>Time ago / in</label>
<input id="ago-in" oninput="computeAgo()" placeholder="Enter a Unix timestamp or date" type="text"/>
<div class="result-block" id="ago-result"></div>
</div>
</div>
<script src="/tools/timestamp/timestamp.js"></script>
