<div class="page">
<h1>Text Shadow Generator</h1>
<p class="subtitle">Quick presets or tune every value. Live preview on a large sample.</p>
<div class="ts-preview" id="ts-preview">
<span contenteditable="true" id="ts-text">SharpDev.Tools</span>
</div>
<div class="ts-presets" id="ts-presets"></div>
<div class="ts-controls">
<div class="ts-slider"><label>Offset X</label><input type="range" id="ts-x" min="-30" max="30" value="2"><span class="val">2px</span></div>
<div class="ts-slider"><label>Offset Y</label><input type="range" id="ts-y" min="-30" max="30" value="2"><span class="val">2px</span></div>
<div class="ts-slider"><label>Blur</label><input type="range" id="ts-blur" min="0" max="60" value="4"><span class="val">4px</span></div>
<div class="ts-slider"><label>Alpha</label><input type="range" id="ts-alpha" min="0" max="100" value="50"><span class="val">50%</span></div>
<div class="ts-color-row">
<label>Shadow color</label>
<input type="color" id="ts-color" value="#000000">
<input type="text" id="ts-hex" value="#000000" maxlength="7" spellcheck="false">
</div>
<div class="ts-color-row">
<label>Text color</label>
<input type="color" id="ts-text-color" value="#ffffff">
<input type="text" id="ts-text-hex" value="#ffffff" maxlength="7" spellcheck="false">
</div>
</div>
