<div class="page">
<h1>JWT Signer</h1>
<p class="subtitle">Build and sign JWTs with HMAC (HS256/384/512). Everything runs in your browser.</p>
<div class="jw-alg">
<label>Algorithm</label>
<select id="alg">
<option value="HS256" selected>HS256</option>
<option value="HS384">HS384</option>
<option value="HS512">HS512</option>
</select>
</div>
<div class="jw-row">
<div class="jw-col">
<label for="payload">Payload (JSON)</label>
<textarea id="payload">{
  "sub": "user_12345",
  "name": "Gillian Scharf",
  "iat": 1713456789
}</textarea>
</div>
<div class="jw-col">
<label for="secret">Secret</label>
<input type="text" id="secret" value="your-256-bit-secret" spellcheck="false">
<label for="header" style="margin-top: 14px;">Header (JSON)</label>
<textarea id="header">{"alg":"HS256","typ":"JWT"}</textarea>
</div>
</div>
<button type="button" class="btn btn-primary" id="sign-btn">Sign token</button>
<div class="err" id="err"></div>
<div class="jw-out-head">
<label>Signed JWT</label>
<button class="copy-btn" id="copy-btn" type="button">Copy</button>
</div>
<div class="jwt-output" id="jwt-output">—</div>
</div>
<script src="/tools/jwt-sign/jwt-sign.js"></script>
