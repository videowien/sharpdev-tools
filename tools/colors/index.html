<div class="page">
<h1>Color Palette Extractor</h1>
<p class="subtitle">Upload an image or paste a URL to extract its dominant colors.</p>
<div class="card">
<div class="upload-area" id="upload-area">
<input accept="image/*" hidden="" id="file-input" type="file"/>
<div class="upload-content" id="upload-content">
<svg class="upload-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>
<p>Drop an image here or <span class="upload-link">click to browse</span></p>
<p class="upload-hint">JPG, PNG, WebP, GIF</p>
</div>
<img class="upload-preview" id="upload-preview" style="display:none"/>
</div>
<div class="url-row" id="url-row">
<span class="or-divider">or</span>
<div class="url-input-row">
<input autocomplete="url" id="url-input" placeholder="Paste image URL..." type="text"/>
<button class="btn btn-secondary" id="url-btn" onclick="loadFromUrl()">Load</button>
</div>
</div>
<div class="reset-row" id="reset-row" style="display:none">
<button class="btn btn-secondary" onclick="resetTool()">
<svg fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px" viewbox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"></path><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"></path></svg>
        New Image
      </button>
</div>
</div>
<div class="palette-area" id="palette-area">
<div class="palette-header">
<h3>Extracted Palette</h3>
<div class="palette-controls">
<label for="color-count">Colors:</label>
<select id="color-count" onchange="reExtract()">
<option value="5">5</option>
<option selected="" value="6">6</option>
<option value="8">8</option>
<option value="10">10</option>
<option value="12">12</option>
</select>
</div>
</div>
<div class="color-cards" id="color-cards"></div>
<div class="eyedropper-section" id="eyedropper-section">
<h3>Pick from Image</h3>
<p class="pick-hint">Click anywhere on the image above to pick a color</p>
<div class="picked-color" id="picked-color" style="display:none">
<div class="picked-swatch" id="picked-swatch"></div>
<div class="picked-values" id="picked-values"></div>
</div>
</div>
</div>
</div>
