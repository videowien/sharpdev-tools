<body>
<noscript><p style="color:#aaa;text-align:center;padding:40px;">This site requires JavaScript to function.</p></noscript>
<script src="/shared/components.js?v=20260616a"></script>
<script>renderNav('tip');</script>
<div class="page">
<h1>Tip Calculator</h1>
<p class="subtitle">Figure out the tip and split the bill.</p>
<div class="tip-grid">
<div class="card">
<label for="bill">Bill amount</label>
<div class="input-with-prefix">
<span class="prefix" id="currency-symbol">$</span>
<input id="bill" min="0" oninput="calculate()" step="0.01" type="number" value="50"/>
</div>
<label for="currency" style="margin-top:16px">Currency</label>
<select id="currency" onchange="updateCurrency(); calculate()">
<option selected="" value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
<option value="CHF">CHF</option>
<option value="¥">¥ JPY</option>
</select>
<label for="tip-pct" style="margin-top:16px">Tip: <span id="tip-val">18%</span></label>
<input id="tip-pct" max="30" min="0" oninput="document.getElementById('tip-val').textContent = this.value + '%'; calculate()" step="1" type="range" value="18"/>
<div class="tip-presets">
<button class="preset" onclick="setTip(10)">10%</button>
<button class="preset" onclick="setTip(15)">15%</button>
<button class="preset" onclick="setTip(18)">18%</button>
<button class="preset" onclick="setTip(20)">20%</button>
<button class="preset" onclick="setTip(25)">25%</button>
</div>
<label for="people" style="margin-top:16px">Split between</label>
<div class="people-row">
<button class="step-btn" onclick="changePeople(-1)">−</button>
<input id="people" min="1" oninput="calculate()" type="number" value="1"/>
<button class="step-btn" onclick="changePeople(1)">+</button>
<span class="people-label">people</span>
</div>
</div>
<div class="card results">
<div class="result-row">
<span class="result-label">Tip amount</span>
<span class="result-val" id="res-tip">$9.00</span>
</div>
<div class="result-row">
<span class="result-label">Total bill</span>
<span class="result-val" id="res-total">$59.00</span>
</div>
<div class="result-divider"></div>
<div class="result-row big">
<span class="result-label">Per person</span>
<span class="result-val" id="res-per-person">$59.00</span>
</div>
<div class="result-row small">
<span class="result-label">Each person's tip</span>
<span class="result-val" id="res-tip-per-person">$9.00</span>
</div>
</div>
</div>
</div>
